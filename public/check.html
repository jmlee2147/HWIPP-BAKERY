<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기기 점검</title>
<style>
  body { margin: 0; padding: 24px; background: #fff; color: #000; font: 20px/1.5 monospace; }
  h1 { font-size: 28px; margin: 0 0 16px; }
  h2 { font-size: 22px; margin: 24px 0 8px; }
  .row { border-bottom: 1px solid #ddd; padding: 6px 0; word-break: break-all; }
  .bad { color: #c00; font-weight: bold; }
  .good { color: #070; }
</style>
</head>
<body>
<!-- 키오스크 브라우저에서 사이트가 하얗게만 뜰 때 원인을 찾는 진단 화면.
     사이트의 JS가 돌지 않아도 보이도록 React 없이, 오래된 엔진도 읽는 문법으로만 쓴다. -->
<h1>기기 점검</h1>
<div id="out"></div>
<script>
  var out = document.getElementById("out");
  function line(label, value, tone) {
    var row = document.createElement("div");
    row.className = "row" + (tone ? " " + tone : "");
    row.appendChild(document.createTextNode(label + ": " + value));
    out.appendChild(row);
  }
  function title(text) {
    var head = document.createElement("h2");
    head.appendChild(document.createTextNode(text));
    out.appendChild(head);
  }

  title("기기");
  var chrome = /Chrome\/(\d+)/.exec(navigator.userAgent);
  line("Chromium", chrome ? chrome[1] : "-");
  line("userAgent", navigator.userAgent);
  line("viewport", window.innerWidth + " x " + window.innerHeight);
  line("screen", screen.width + " x " + screen.height);
  line("devicePixelRatio", window.devicePixelRatio);

  // 이 문법을 못 읽으면 사이트의 JS가 통째로 멈춘다. 오른쪽 숫자는 처음 지원한 Chromium 버전이다.
  title("문법");
  var syntax = [
    ["optional chaining a?.b", "var a = null; return a?.b;", 80],
    ["nullish a ?? b", "return null ?? 1;", 80],
    ["logical assignment a ??= b", "var a = null; a ??= 1; return a;", 85],
    ["class fields", "class A { x = 1; static y = 2; } return new A().x;", 74],
    ["private methods #m()", "class A { #m() { return 1; } run() { return this.#m(); } } return new A().run();", 84],
    ["#x in obj", "class A { #x = 1; static has(o) { return #x in o; } } return A.has(new A());", 91],
    ["class static block", "class A { static { this.v = 1; } } return A.v;", 94],
    ["regexp /d flag", "return /a/d.exec('a').indices.length;", 90]
  ];
  for (var i = 0; i < syntax.length; i++) {
    try {
      new Function(syntax[i][1])();
      line(syntax[i][0], "지원 (" + syntax[i][2] + "+)", "good");
    } catch (error) {
      line(syntax[i][0], "미지원 (" + syntax[i][2] + "+) " + error, "bad");
    }
  }

  title("기능");
  var features = [
    ["Array.prototype.at", typeof [].at === "function", 92],
    ["Object.hasOwn", typeof Object.hasOwn === "function", 93],
    ["structuredClone", typeof window.structuredClone === "function", 98],
    ["Array.prototype.findLast", typeof [].findLast === "function", 97],
    ["Promise.withResolvers", typeof Promise.withResolvers === "function", 119],
    ["ResizeObserver", typeof window.ResizeObserver === "function", 64],
    ["CSS aspect-ratio", window.CSS && CSS.supports("aspect-ratio: 1 / 1"), 88],
    ["CSS inset", window.CSS && CSS.supports("inset: 0"), 87],
    ["CSS gap(flex)", window.CSS && CSS.supports("gap: 1px"), 84]
  ];
  for (var j = 0; j < features.length; j++) {
    line(features[j][0], (features[j][1] ? "지원" : "미지원") + " (" + features[j][2] + "+)", features[j][1] ? "good" : "bad");
  }

  // 첫 화면이 불러오는 JS 파일을 하나씩 실행해 보고, 실패하면 파일과 오류를 적는다.
  title("사이트 JS");
  var errors = [];
  window.onerror = function (message, source, lineNo, column) {
    errors.push(message + " @ " + String(source).split("/").pop() + ":" + lineNo + ":" + column);
  };
  var request = new XMLHttpRequest();
  request.open("GET", "/", true);
  request.onload = function () {
    var found = request.responseText.match(/\/_next\/static\/[^"']+\.js/g) || [];
    var files = [];
    for (var k = 0; k < found.length; k++) {
      if (files.indexOf(found[k]) < 0) files.push(found[k]);
    }
    line("파일 수", files.length);
    var left = files.length;
    if (left === 0) return;
    for (var m = 0; m < files.length; m++) {
      var script = document.createElement("script");
      script.src = files[m];
      script.onload = script.onerror = function () {
        left -= 1;
        if (left > 0) return;
        if (errors.length === 0) {
          line("결과", "읽기 오류 없음", "good");
          return;
        }
        for (var n = 0; n < errors.length; n++) line("오류 " + (n + 1), errors[n], "bad");
      };
      document.body.appendChild(script);
    }
  };
  request.onerror = function () {
    line("결과", "첫 화면을 받아오지 못함", "bad");
  };
  request.send();
</script>
<h2>소리</h2>
<div id="sound"></div>
<div id="sound-buttons"></div>
<div id="sound-log"></div>
<script>
  // 배경음악이 안 나올 때 원인을 가르는 점검. 브라우저는 터치 이후에만 소리를 내므로 버튼으로 시작한다.
  var soundOut = document.getElementById("sound");
  var soundLog = document.getElementById("sound-log");
  var startedAt = Date.now();
  function soundLine(target, text, tone) {
    var row = document.createElement("div");
    row.className = "row" + (tone ? " " + tone : "");
    row.appendChild(document.createTextNode(text));
    target.appendChild(row);
  }
  function log(text, tone) {
    soundLine(soundLog, ((Date.now() - startedAt) / 1000).toFixed(1) + "s " + text, tone);
  }

  var probe = document.createElement("audio");
  var types = [
    ["m4a(AAC)", 'audio/mp4; codecs="mp4a.40.2"'],
    ["mp3", "audio/mpeg"],
    ["wav", "audio/wav"]
  ];
  for (var t = 0; t < types.length; t++) {
    var answer = probe.canPlayType ? probe.canPlayType(types[t][1]) : "";
    soundLine(soundOut, types[t][0] + ": " + (answer || "미지원"), answer ? "good" : "bad");
  }
  var AudioContextClass = window.AudioContext || window.webkitAudioContext;
  soundLine(soundOut, "AudioContext: " + (AudioContextClass ? "있음" : "없음"), AudioContextClass ? "good" : "bad");

  var EVENTS = ["loadedmetadata", "canplay", "canplaythrough", "playing", "pause", "waiting", "stalled", "suspend", "ended", "error"];
  var players = [];
  var sources = [];

  // 재생 이벤트와 3초 뒤 재생 위치를 적는다. 위치가 0이면 소리가 나지 않은 것이다.
  function watch(audio, name) {
    for (var e = 0; e < EVENTS.length; e++) {
      (function (type) {
        audio.addEventListener(type, function () {
          var detail = type === "error" && audio.error ? " code=" + audio.error.code + " " + (audio.error.message || "") : "";
          log(name + " " + type + detail, type === "error" ? "bad" : "");
        });
      })(EVENTS[e]);
    }
    setTimeout(function () {
      log(name + " 3초 뒤 위치 " + audio.currentTime.toFixed(2) + "s, paused=" + audio.paused, audio.currentTime > 0 && !audio.paused ? "good" : "bad");
    }, 3000);
  }
  function playElement(src, name, loop) {
    var audio = new Audio(src);
    audio.preload = "auto";
    audio.loop = !!loop;
    players.push(audio);
    watch(audio, name);
    try {
      var result = audio.play();
      if (result && result.then) {
        result.then(function () {
          log(name + " play() 성공", "good");
        }, function (error) {
          log(name + " play() 거부 " + error.name + " " + error.message, "bad");
        });
      }
    } catch (error) {
      log(name + " play() 예외 " + error, "bad");
    }
    return audio;
  }
  function stopAll() {
    for (var p = 0; p < players.length; p++) players[p].pause();
    for (var s = 0; s < sources.length; s++) sources[s].stop(0);
    players = [];
    sources = [];
    log("모두 정지");
  }

  var context = null;
  function playWebAudio(src, name) {
    if (!AudioContextClass) return log(name + " AudioContext 없음", "bad");
    if (!context) context = new AudioContextClass();
    if (context.resume) context.resume();
    var xhr = new XMLHttpRequest();
    xhr.open("GET", src, true);
    xhr.responseType = "arraybuffer";
    xhr.onload = function () {
      log(name + " 받음 " + xhr.response.byteLength + "B, 디코딩 시작");
      context.decodeAudioData(xhr.response, function (buffer) {
        log(name + " 디코딩 성공 " + buffer.duration.toFixed(1) + "s " + buffer.numberOfChannels + "ch " + buffer.sampleRate + "Hz", "good");
        var source = context.createBufferSource();
        source.buffer = buffer;
        source.connect(context.destination);
        source.start(0);
        sources.push(source);
        log(name + " 재생 시작, context=" + context.state);
      }, function (error) {
        log(name + " 디코딩 실패 " + error, "bad");
      });
    };
    xhr.onerror = function () {
      log(name + " 받기 실패", "bad");
    };
    xhr.send();
  }

  var BGM = "/assets/sounds/bgm.m4a";
  var tests = [
    ["배경음악 (Audio)", function () { playElement(BGM, "bgm", true); }],
    ["효과음 m4a", function () { playElement("/assets/sounds/door-bell.m4a", "door-bell.m4a"); }],
    ["효과음 mp3", function () { playElement("/assets/sounds/choice.mp3", "choice.mp3"); }],
    // 사이트는 첫 화면에서 소리 11개를 미리 만들어 둔다. 동시에 둘 수 있는 미디어 수가 모자란지 본다.
    ["11개 미리 만든 뒤 배경음악", function () {
      var names = ["door-bell.m4a", "door-open.mp3", "choice.mp3", "card-slide.m4a", "card-flip.m4a", "pop-up.m4a", "talk.wav", "talk.wav", "talk.wav", "talk.wav"];
      for (var n = 0; n < names.length; n++) {
        var extra = new Audio("/assets/sounds/" + names[n]);
        extra.preload = "auto";
        players.push(extra);
      }
      log("미리 만든 소리 " + names.length + "개");
      playElement(BGM, "bgm(11개 중)", true);
    }],
    // START를 누르면 효과음과 배경음악이 함께 시작된다. 효과음이 배경음악을 멈추게 하는지 본다.
    ["효과음과 배경음악 동시", function () {
      playElement("/assets/sounds/choice.mp3", "choice.mp3");
      playElement(BGM, "bgm(동시)", true);
    }],
    ["배경음악 (Web Audio)", function () { playWebAudio(BGM, "bgm(WebAudio)"); }],
    ["모두 정지", stopAll]
  ];
  var buttons = document.getElementById("sound-buttons");
  for (var b = 0; b < tests.length; b++) {
    var button = document.createElement("button");
    button.type = "button";
    button.style.cssText = "font: inherit; margin: 8px 8px 0 0; padding: 16px 20px;";
    button.appendChild(document.createTextNode(tests[b][0]));
    button.onclick = tests[b][1];
    buttons.appendChild(button);
  }
</script>
</body>
</html>
